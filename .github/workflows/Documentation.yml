name: Documentation
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
env:
  # Single source of truth for both jobs. DocumenterSlate's cache key includes
  # the running Julia version, so a mismatch between the two would make the
  # render job's cache permanently unusable to the deploy job — surfacing as an
  # unhelpful "cache miss" error rather than as the version drift it is.
  JULIA_VERSION: '1.12'
  # Pkg clones via libgit2, which ignores git's `insteadOf` rewriting. This
  # switches it to the git CLI so the credential rewrite in the auth steps
  # below actually applies.
  JULIA_PKG_USE_CLI_GIT: 'true'

jobs:
  # Executes notebook code. It holds ONE secret and no more: a read-only token
  # for the private dependency, which it cannot resolve the environment without.
  # That is a real weakening of the render/deploy split — the point of which is
  # that the job running arbitrary Julia holds nothing worth stealing — so scope
  # the token to read access on s-celles/SymbolicUncertainties.jl alone. The
  # deploy credential is still absent here, which is the part that matters:
  # notebook code cannot publish to the site.
  render-notebooks:
    name: Render notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}
      - uses: julia-actions/cache@v2
      - uses: actions/cache@v6
        with:
          path: docs/slate_cache
          key: slate-${{ runner.os }}-${{ env.JULIA_VERSION }}-${{ hashFiles('notebooks/**/*.jl', 'notebooks/Project.toml', 'src/**/*.jl') }}
          restore-keys: slate-${{ runner.os }}-${{ env.JULIA_VERSION }}-
      # `[sources]` resolves SymbolicUncertainties from its repository, which is
      # private. Pkg clones through libgit2, which does NOT implement git's
      # `url.<base>.insteadOf` rewriting — hence `JULIA_PKG_USE_CLI_GIT`, which
      # makes Pkg shell out to the git CLI so the rewrite below is honoured.
      # Without both halves the clone falls back to an anonymous HTTPS fetch,
      # prompts for a username, and aborts the job.
      #
      # The token is passed through the environment rather than interpolated
      # into the command line, so it is never part of a rendered `run:` string.
      - name: Grant read access to the private dependency
        shell: bash
        env:
          DEP_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: |
          if [ -z "$DEP_TOKEN" ]; then
            echo "::error::PRIVATE_DEPS_TOKEN is not set. Pkg cannot clone the" \
                 "private s-celles/SymbolicUncertainties.jl. Add a fine-grained" \
                 "PAT with read access to that repository as the repository" \
                 "secret PRIVATE_DEPS_TOKEN (and as a Dependabot secret, so" \
                 "Dependabot's own pull requests resolve too)."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${DEP_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
      - name: Render notebooks
        run: julia --project=docs docs/render.jl
      - uses: actions/upload-artifact@v4
        with:
          name: slate-cache
          path: docs/slate_cache
          retention-days: 1

  # Never executes notebook code: docs/make.jl runs with `execution = :never`,
  # where a cache miss raises instead of falling back to executing. This is the
  # only job with DOCUMENTER_KEY in scope.
  build-and-deploy:
    name: Build and deploy
    needs: render-notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}
      - uses: julia-actions/cache@v2
      # An artifact rather than actions/cache here: this must be exactly what
      # render-notebooks produced in *this* run, not a key-matched (possibly
      # stale, possibly absent) entry from an earlier one. If the artifact is
      # missing this step fails outright instead of quietly proceeding with an
      # empty cache.
      - uses: actions/download-artifact@v4
        with:
          name: slate-cache
          path: docs/slate_cache
      # `[sources]` resolves SymbolicUncertainties from its repository, which is
      # private. Pkg clones through libgit2, which does NOT implement git's
      # `url.<base>.insteadOf` rewriting — hence `JULIA_PKG_USE_CLI_GIT`, which
      # makes Pkg shell out to the git CLI so the rewrite below is honoured.
      # Without both halves the clone falls back to an anonymous HTTPS fetch,
      # prompts for a username, and aborts the job.
      #
      # The token is passed through the environment rather than interpolated
      # into the command line, so it is never part of a rendered `run:` string.
      - name: Grant read access to the private dependency
        shell: bash
        env:
          DEP_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: |
          if [ -z "$DEP_TOKEN" ]; then
            echo "::error::PRIVATE_DEPS_TOKEN is not set. Pkg cannot clone the" \
                 "private s-celles/SymbolicUncertainties.jl. Add a fine-grained" \
                 "PAT with read access to that repository as the repository" \
                 "secret PRIVATE_DEPS_TOKEN (and as a Dependabot secret, so" \
                 "Dependabot's own pull requests resolve too)."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${DEP_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
      - name: Build and deploy
        env:
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --project=docs docs/make.jl
